<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../static/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(900px 620px at 0 0, rgba(190,235,205,.95), rgba(190,235,205,0) 70%), #F3F9F4; }
  .og { position: relative; width: 1200px; height: 630px; padding: 64px 72px; }
  .og .brand { font-size: 30px; gap: 16px; }
  .og .brand img { width: 64px; height: 64px; border-radius: 15px; }
  .og h1 { margin-top: 74px; font-size: 92px; line-height: 1.0; }
  .og p { margin-top: 26px; max-width: 600px; color: #4A6354; font: 500 32px/1.35 "Inter", sans-serif; }
  .art { position: absolute; right: 40px; top: 44px; width: 440px; height: 760px; display: grid; place-items: center; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .art .phone { --w: 330px; }
</style></head><body>
<div class="og">
  <span class="brand"><img src="../static/img/icon-192.png" alt=""><span>Dual Messenger+</span></span>
  <h1>Two WhatsApp<br>accounts,<br>one iPhone</h1>
  <div class="art">
    <svg viewBox="0 0 560 640" preserveAspectRatio="xMidYMid meet">
      <g fill="#FFDDBB"><ellipse cx="385" cy="420" rx="175" ry="155"/><path d="M521 516c3 40 13 68 27 90-34-2-66-20-84-48z"/></g>
      <g fill="#C9EBD5"><ellipse cx="190" cy="250" rx="190" ry="170"/><path d="M42 355c-2 45-12 75-28 97 36-2 71-22 90-51z"/></g>
    </svg>
    <div class="phone"><div class="screen"><img src="../static/img/screen-main.webp" alt=""><span class="island"></span></div></div>
  </div>
</div>
</body></html>
